name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wake-word tokenizer
        run: pip install sherpa-onnx==1.13.8 sentencepiece pypinyin click
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/voice-models
          key: voice-models-${{ hashFiles('scripts/fetch_models.sh') }}
      - name: Download offline voice models
        run: bash scripts/fetch_models.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Prepare signing key
        env:
          KEY_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PASS="$KEY_PASS"
          else
            echo "::warning::No signing secret set. Using a throwaway key, so this APK cannot update the previous one."
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASS" -keypass "$PASS" \
              -alias assistant -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Pocket Assistant"
          fi
          echo "::add-mask::$PASS"
          {
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_PASSWORD=$PASS"
            echo "SIGNING_KEY_ALIAS=assistant"
            echo "SIGNING_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"
      - name: Run security tests
        run: gradle :policy:test --stacktrace
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Check Android 12 compatibility
        run: |
          gradle :app:lintRelease --stacktrace
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk | tee badging.txt | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|native-code)"
          grep -q "sdkVersion:'31'" badging.txt
      - name: Report resolved LiteRT-LM version
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath | grep -m3 -E 'litertlm|sherpa' || true
      - name: Check manifest has no internet access
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT" dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "::error::INTERNET permission found in APK"; exit 1
          fi
          "$AAPT" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/release/app-release.apk | grep -E 'debuggable|allowBackup' || true
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-assistant-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: policy/build/reports/tests
